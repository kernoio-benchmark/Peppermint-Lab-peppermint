services:
  postgres:
    image: "postgres:16-alpine"
    pull_policy: missing
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - "POSTGRES_USER=test_user"
      - "POSTGRES_PASSWORD=test_password"
      - "POSTGRES_DB=test_db"
    ports:
      - "5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U test_user -d test_db"
      interval: "3s"
      timeout: "5s"
      retries: "10"
    tmpfs:
      - /var/lib/postgresql/data
    labels:
      - external-url=postgresql://localhost:{{PORT}}/test_db?user=test_user&password=test_password

  sut:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile: ${DOCKERFILE_PATH}
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "5003"
    healthcheck:
      test:
        - CMD-SHELL
        - nc -z 127.0.0.1 5003 || exit 1
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
    labels:
      - jwt-signing-config=HS256:${SECRET}
